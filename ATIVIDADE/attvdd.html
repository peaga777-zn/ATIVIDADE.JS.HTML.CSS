<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>
        <p>Descubra seu Índice de Massa Corporal</p>

        <label>Seu peso (kg):</label>
        <input type="number" id="peso" placeholder="Ex: 70">

        <label>Sua altura (metros):</label>
        <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01">

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado"></div>

    </div>

    <script src="atvidade.js"></script>
</body>
</html>
